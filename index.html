<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naveen Jewellers' Nazaakat — Artificial, American Diamond &amp; Ethnic Jewellery</title>
<meta name="description" content="Naveen Jewellers' Nazaakat — western, American Diamond and ethnic artificial jewellery. Browse the counter, enquire on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NAZAAKAT — design tokens
   Palette: wine (the counter cloth) / ivory (the paper tag) /
   antique gold (the hallmark) + one velvet tone per product line
   ============================================================ */
:root{
  /* Midnight & Champagne — set as the live default. See THEMES in the
     script for the other two palettes; the values below must match
     THEMES.sapphire.vars exactly so first paint isn't wine before JS runs. */
  --wine:#152A4C;
  --wine-deep:#081527;
  --gold:#C8B58C;
  --gold-soft:#E7DCC4;
  --ivory:#F7F5F0;
  --sand:#E9E5DC;
  --ink:#161C26;
  --muted:#71767F;
  --line:#DCD8CE;

  /* velvet per line — the tray each piece is laid on */
  --velvet-ethnic:#3A1330;
  --velvet-ad:#102244;
  --velvet-western:#28313C;

  --r:2px;
  --shadow:0 1px 2px rgba(46,7,19,.05), 0 8px 24px -12px rgba(46,7,19,.18);
  --maxw:1180px;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{
  margin:0;background:var(--ivory);color:var(--ink);overflow-x:hidden;
  font-family:'Manrope',system-ui,sans-serif;font-weight:400;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Prata',Georgia,serif;font-weight:400;letter-spacing:.005em;line-height:1.18;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 20px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow.on-dark{color:var(--gold-soft)}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* hallmark divider — the punch mark stamped inside a ring shank */
.hallmark{display:flex;align-items:center;gap:14px;color:var(--gold)}
.hallmark::before,.hallmark::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
.hallmark span{font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.9}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 24px;border-radius:var(--r);font-size:13px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;transition:.25s var(--ease);
  min-height:48px;
}
.btn-gold{background:var(--gold);color:var(--wine-deep)}
.btn-gold:hover{background:var(--gold-soft)}
.btn-wine{background:var(--wine);color:var(--ivory)}
.btn-wine:hover{background:var(--wine-deep)}
.btn-ghost{border:1px solid currentColor;color:var(--ivory)}
.btn-ghost:hover{background:rgba(250,246,239,.1)}
.btn-outline{border:1px solid var(--line);color:var(--ink);background:#fff}
.btn-outline:hover{border-color:var(--gold)}
.btn-wa{background:#128C4A;color:#fff}
.btn-wa:hover{background:#0f7a40}
.btn-block{width:100%}

/* ---------- header ---------- */
.masthead{position:sticky;top:0;z-index:60;background:var(--ivory);border-bottom:1px solid var(--line)}
.mast-in{display:flex;align-items:center;gap:16px;height:66px}
.brand{display:flex;flex-direction:column;line-height:1;margin-right:auto}
.brand .small{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand .big{font-family:'Prata',serif;font-size:23px;letter-spacing:.02em;margin-top:4px}
.brand .big em{font-style:normal;color:var(--gold)}
.nav{display:none;gap:28px;align-items:center}
.nav a{font-size:13px;letter-spacing:.06em;padding:6px 0;border-bottom:1px solid transparent}
.nav a:hover,.nav a.on{border-bottom-color:var(--gold)}
.mast-cta{display:none}
.burger{width:44px;height:44px;display:grid;place-items:center;margin-right:-10px}
.burger span{display:block;width:20px;height:1.5px;background:var(--ink);position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:20px;height:1.5px;background:var(--ink)}
.burger span::before{top:-6px}.burger span::after{top:6px}
@media(min-width:900px){
  .nav{display:flex}.burger{display:none}.mast-cta{display:inline-flex}
  .mast-in{height:84px}
}

/* mobile drawer */
.drawer{position:fixed;inset:0;z-index:100;background:var(--wine-deep);color:var(--ivory);padding:22px;display:none;overflow:auto}
.drawer.open{display:block}
.drawer .close{position:absolute;right:14px;top:14px;font-size:26px;width:44px;height:44px;color:var(--ivory)}
.drawer h4{font-family:'Prata',serif;font-size:15px;color:var(--gold);margin:30px 0 10px}
.drawer a{display:block;padding:11px 0;font-size:17px;border-bottom:1px solid rgba(226,214,198,.14)}

/* ---------- hero: the counter ---------- */
.hero{background:var(--wine-deep);color:var(--ivory);padding:52px 0 0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -10%, rgba(198,161,91,.16), transparent 60%)}
.hero-in{position:relative;z-index:1}
.hero h1{font-size:clamp(34px,8.6vw,62px);margin:16px 0 0}
.hero h1 em{font-style:normal;color:var(--gold-soft)}
.hero .lede{max-width:46ch;margin-top:16px;color:rgba(250,246,239,.76);font-size:16px;font-weight:300}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

/* the tray — three velvet panels, one per line */
.trays{display:grid;gap:14px;margin-top:40px;padding-bottom:44px}
@media(min-width:820px){.trays{grid-template-columns:repeat(3,1fr);gap:18px}}
.tray{
  position:relative;border-radius:var(--r);padding:22px 20px 20px;color:var(--ivory);
  border:1px solid rgba(198,161,91,.28);overflow:hidden;display:block;
  transition:.35s var(--ease);
}
.tray:hover{transform:translateY(-3px);border-color:var(--gold)}
.tray::before{content:"";position:absolute;inset:0;
  background:radial-gradient(85% 60% at 30% 0%, rgba(255,255,255,.16), transparent 65%);pointer-events:none}
.v-ethnic{background:var(--velvet-ethnic)}
.v-ad{background:var(--velvet-ad)}
.v-western{background:var(--velvet-western)}
.tray .num{font-size:10px;letter-spacing:.24em;color:var(--gold-soft);text-transform:uppercase}
.tray h3{font-size:24px;margin:8px 0 6px}
.tray p{font-size:13.5px;color:rgba(250,246,239,.72);font-weight:300;min-height:42px}
.tray .art{margin:14px 0 6px;opacity:.92}
.tray .go{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);display:inline-flex;gap:7px;align-items:center}

/* ---------- sections ---------- */
.sec{padding:56px 0}
.sec-tight{padding:40px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.sec-head h2{font-size:clamp(24px,5vw,34px)}
.sec-head .link{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line);padding-bottom:3px}
.sec-head .link:hover{color:var(--wine);border-color:var(--gold)}
.sec-sand{background:var(--sand)}

/* ---------- product card ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}

.rail{display:grid;grid-auto-flow:column;grid-auto-columns:64%;gap:14px;overflow-x:auto;
  scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -20px;padding-left:20px;padding-right:20px}
.rail>*{scroll-snap-align:start}
.rail::-webkit-scrollbar{height:3px}
.rail::-webkit-scrollbar-thumb{background:var(--line)}
@media(min-width:700px){.rail{grid-auto-columns:32%}}
@media(min-width:1000px){.rail{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);overflow:visible;margin:0;padding:0}}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.3s var(--ease)}
.card:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.card .shot{position:relative;aspect-ratio:4/5;overflow:hidden}
.card .shot img{width:100%;height:100%;object-fit:cover}
.card:hover .shot .art-wrap{transform:scale(1.04)}
.art-wrap{width:100%;height:100%;display:block;transition:.5s var(--ease)}
.badge{position:absolute;left:10px;top:10px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:5px 9px;background:var(--ivory);color:var(--wine);font-weight:700;border-radius:var(--r)}
.badge.new{background:var(--gold);color:var(--wine-deep)}
.card .body{padding:13px 13px 15px;display:flex;flex-direction:column;gap:5px;flex:1}
.card .line-tag{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card h3{font-size:15px;line-height:1.32}
.card .price{font-size:15px;font-weight:600;margin-top:auto;padding-top:6px}
.card .price s{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:7px}

/* ---------- type pills ---------- */
.pills{display:flex;flex-wrap:wrap;gap:9px}
.pill{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:100px;font-size:13px;transition:.2s}
.pill:hover{border-color:var(--gold)}
.pill.on{background:var(--wine);color:var(--ivory);border-color:var(--wine)}

/* ---------- story / trust ---------- */
.split{display:grid;gap:26px;align-items:center}
@media(min-width:860px){.split{grid-template-columns:1fr 1fr;gap:52px}}
.story-shot{aspect-ratio:4/3;background:var(--velvet-ethnic);border-radius:var(--r);position:relative;overflow:hidden;display:grid;place-items:center;color:var(--gold-soft)}
.story-shot .cap{position:absolute;bottom:12px;left:12px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
.story h2{font-size:clamp(26px,5.4vw,38px);margin:12px 0 14px}
.story p{color:var(--muted);margin-bottom:14px}

.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
@media(min-width:860px){.trust{grid-template-columns:repeat(4,1fr)}}
.trust div{background:var(--ivory);padding:22px 18px}
.trust h4{font-family:'Prata',serif;font-size:16px;margin-bottom:6px}
.trust p{font-size:13px;color:var(--muted)}

/* ---------- shop page ---------- */
.shop-top{padding:26px 0 18px;border-bottom:1px solid var(--line)}
.shop-top h1{font-size:clamp(26px,6vw,40px);margin:8px 0 6px}
.shop-top p{color:var(--muted);font-size:14px;max-width:60ch}
.shop-body{display:grid;gap:26px;padding:22px 0 60px}
@media(min-width:900px){.shop-body{grid-template-columns:230px 1fr;gap:44px}}
.filters{display:none}
.filters.show{display:block}
@media(min-width:900px){.filters{display:block}}
.fgroup{border-bottom:1px solid var(--line);padding:16px 0}
.fgroup:first-child{padding-top:0}
.fgroup h4{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:11px;font-family:'Manrope',sans-serif}
.fopt{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px;cursor:pointer}
.fopt input{width:16px;height:16px;accent-color:var(--wine)}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.fbar .count{font-size:13px;color:var(--muted)}
.fbar select{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:var(--r);font:inherit;font-size:13px;min-height:44px}
.ftoggle{display:inline-flex}
@media(min-width:900px){.ftoggle{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--sand);border:1px solid var(--line);padding:6px 11px;border-radius:100px;font-size:12px}
.chip button{color:var(--muted);font-size:14px;line-height:1}
.empty{border:1px dashed var(--line);padding:44px 20px;text-align:center;color:var(--muted);border-radius:var(--r)}

/* ---------- product detail ---------- */
.crumbs{font-size:12px;color:var(--muted);padding:16px 0}
.crumbs a:hover{color:var(--wine)}
.pdp{display:grid;gap:26px;padding-bottom:40px}
@media(min-width:900px){.pdp{grid-template-columns:1.05fr .95fr;gap:52px;padding-bottom:70px}}
.gallery{min-width:0}
.gallery .main{aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.thumbs{display:flex;gap:9px;margin-top:9px;overflow-x:auto;padding-bottom:4px}
.thumbs::-webkit-scrollbar{height:3px}
.thumbs::-webkit-scrollbar-thumb{background:var(--line)}
.thumbs button{display:block;flex-shrink:0;width:70px;aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0}
.thumbs button.on{border-color:var(--wine);border-width:2px}
.pdp-info h1{font-size:clamp(25px,5.4vw,36px);margin:8px 0 10px}
.pdp-price{font-size:25px;font-weight:600;display:flex;align-items:baseline;gap:11px;margin-bottom:6px}
.pdp-price s{font-size:16px;color:var(--muted);font-weight:400}
.pdp-price .off{font-size:12px;color:#1E7A46;font-weight:700;letter-spacing:.06em}
.tax{font-size:12px;color:var(--muted);margin-bottom:20px}
.pdp-desc{color:var(--muted);margin-bottom:22px}
.pdp-actions{display:grid;gap:10px;margin-bottom:24px}
@media(min-width:520px){.pdp-actions{grid-template-columns:1fr auto}}
.specs{border-top:1px solid var(--line)}
.specs div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.specs dt{color:var(--muted)}
.specs dd{margin:0;text-align:right;font-weight:500}
.assure{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.assure span{font-size:11.5px;background:var(--sand);padding:7px 11px;border-radius:100px;color:var(--wine);letter-spacing:.03em}
.sticky-buy{position:sticky;bottom:0;z-index:40;background:var(--ivory);border-top:1px solid var(--line);
  padding:10px 20px;display:flex;gap:10px;align-items:center}
.sticky-buy .p{font-weight:700;font-size:16px;white-space:nowrap}
@media(min-width:900px){.sticky-buy{display:none}}

/* ---------- simple content pages ---------- */
.prose{max-width:68ch}
.prose h2{font-size:clamp(22px,4.6vw,29px);margin:34px 0 12px}
.prose h3{font-size:18px;margin:24px 0 8px}
.prose p,.prose li{color:var(--muted);margin-bottom:11px}
.prose ul{padding-left:18px;margin:0 0 14px}
.page-head{background:var(--wine-deep);color:var(--ivory);padding:46px 0}
.page-head h1{font-size:clamp(30px,7vw,50px);margin:12px 0 10px}
.page-head p{color:rgba(250,246,239,.72);max-width:52ch;font-weight:300}

.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{padding:16px 0;cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--gold);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq .ans{padding:0 0 16px;color:var(--muted);font-size:14.5px}

.care-grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.care-grid{grid-template-columns:repeat(2,1fr)}}
.care-card{background:#fff;border:1px solid var(--line);padding:20px;border-radius:var(--r)}
.care-card h3{font-size:18px;margin-bottom:8px}
.care-card ul{padding-left:17px;margin:0}
.care-card li{font-size:14px;color:var(--muted);margin-bottom:7px}

.contact-grid{display:grid;gap:26px}
@media(min-width:860px){.contact-grid{grid-template-columns:1fr 1fr;gap:52px}}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;padding:13px;border-radius:var(--r);font:inherit;font-size:15px;min-height:48px}
.field textarea{min-height:110px;resize:vertical}
.visit-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.visit-row .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);min-width:88px;padding-top:3px;font-weight:600}
.visit-row .v{font-size:15px}

/* ---------- map ---------- */
.map{margin-top:22px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sand)}
.map iframe{display:block;width:100%;height:300px;border:0;filter:saturate(.85)}
.map .strip{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line)}
.map .strip span{font-size:12.5px;color:var(--muted)}
.map-cta{display:grid;place-items:center;padding:30px 20px;text-align:center;gap:12px}
.map-cta p{font-size:13.5px;color:var(--muted);max-width:38ch}

/* ---------- footer ---------- */
footer{background:var(--wine-deep);color:rgba(250,246,239,.72);padding:48px 0 26px;margin-top:0}
.f-grid{display:grid;gap:28px}
@media(min-width:760px){.f-grid{grid-template-columns:1.4fr 1fr 1fr 1fr}}
footer h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;font-family:'Manrope',sans-serif;font-weight:700}
footer a{display:block;padding:5px 0;font-size:14px}
footer a:hover{color:var(--gold-soft)}
.f-brand .big{font-family:'Prata',serif;font-size:26px;color:var(--ivory)}
.f-brand p{font-size:13.5px;margin-top:10px;max-width:34ch;font-weight:300}
.f-base{margin-top:34px;padding-top:18px;border-top:1px solid rgba(226,214,198,.14);font-size:12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}

/* floating whatsapp */
.wa-float{position:fixed;right:16px;bottom:16px;z-index:70;width:54px;height:54px;border-radius:50%;
  background:#128C4A;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.24)}
.wa-float svg{width:27px;height:27px;fill:#fff}
@media(min-width:900px){.wa-float{right:24px;bottom:24px}}
.pdp-page .wa-float{bottom:78px}
@media(min-width:900px){.pdp-page .wa-float{bottom:24px}}

/* ---------- cart ---------- */
.cart-btn{position:relative;width:44px;height:44px;display:grid;place-items:center}
.cart-btn svg{width:21px;height:21px;fill:none;stroke:var(--ink);stroke-width:1.6}
.cart-btn .n{position:absolute;top:4px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--wine);
  color:var(--ivory);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.scrim{position:fixed;inset:0;background:rgba(46,7,19,.45);z-index:90;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--ivory);z-index:95;
  transform:translateX(102%);transition:.3s var(--ease);display:flex;flex-direction:column}
.panel.on{transform:none}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.panel header h3{font-size:20px}
.panel .x{font-size:26px;width:44px;height:44px}
.panel .scrolls{overflow:auto;flex:1;padding:6px 20px 20px}
.panel footer{border-top:1px solid var(--line);padding:16px 20px 20px;background:var(--ivory)}
.citem{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.citem .th{aspect-ratio:4/5;border:1px solid var(--line);overflow:hidden;border-radius:var(--r)}
.citem h4{font-size:14px;font-weight:600;line-height:1.3}
.citem .meta{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);margin-top:8px;background:#fff}
.qty button{width:34px;height:34px;font-size:16px;color:var(--muted)}
.qty span{min-width:26px;text-align:center;font-size:14px;font-weight:600}
.citem .rm{font-size:11.5px;color:var(--muted);text-decoration:underline;margin-left:12px}
.ctot{display:flex;justify-content:space-between;font-size:17px;font-weight:700;margin-bottom:4px}
.ctot+p{font-size:12px;color:var(--muted);margin-bottom:14px}

/* ---------- palette compare ---------- */
.pal-grid{display:grid;gap:18px}
@media(min-width:900px){.pal-grid{grid-template-columns:repeat(3,1fr)}}
.pal-col{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--ivory)}
.pal-hero{background:var(--wine-deep);color:var(--ivory);padding:24px 20px 26px}
.pal-hero .t{font-family:'Prata',serif;font-size:27px;margin:8px 0 8px}
.pal-hero .t em{font-style:normal;color:var(--gold-soft)}
.pal-hero p{font-size:12.5px;color:rgba(250,246,239,.7);font-weight:300}
.pal-body{padding:16px}
.pal-swatches{display:flex;gap:6px;margin:14px 0}
.pal-swatches i{flex:1;height:34px;border-radius:var(--r);display:block}
.pal-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pal-note{font-size:12.5px;color:var(--muted);margin:10px 0 14px}

/* ---------- prototype tools ---------- */
.devbar{position:fixed;left:12px;bottom:12px;z-index:80;background:rgba(36,19,24,.94);color:#fff;
  border-radius:100px;display:flex;align-items:center;gap:4px;padding:5px 6px;font-size:11px;
  box-shadow:0 6px 22px rgba(0,0,0,.28);backdrop-filter:blur(6px)}
.devbar b{font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;padding:0 7px 0 8px}
.devbar button{padding:7px 11px;border-radius:100px;color:#fff;opacity:.72;letter-spacing:.04em}
.devbar button:hover{opacity:1;background:rgba(255,255,255,.12)}
.devbar button.on{background:var(--gold);color:#2E0713;opacity:1;font-weight:700}
@media(max-width:560px){.devbar b{display:none}.devbar{left:8px;bottom:8px}}
.studio-row{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.studio-row .th{aspect-ratio:4/5;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.studio-row h4{font-size:13.5px;font-weight:600}
.studio-row .code{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.studio-row input[type=file]{font-size:11px;margin-top:5px;max-width:190px}
.gallery .main img,.thumbs button img,.citem .th img,.studio-row .th img{width:100%;height:100%;object-fit:cover}

.note{background:#FFF8E6;border:1px dashed var(--gold);padding:12px 14px;font-size:12.5px;color:#6B5520;border-radius:var(--r)}
</style>
</head>

const THEMES = {

let THEME = "sapphire";
function applyTheme(k){
  THEME = k;
  suppressScroll = true;
  Object.entries(THEMES[k].vars).forEach(([n,v])=>document.documentElement.style.setProperty("--"+n, v));
  router();
}
const pal = k => THEMES[k||THEME].vars;

function art(p, view, theme){

  const g = P.gold, gs = P["gold-soft"];
  const draw = {

      <rect x="140" y="198" width="20" height="44" rx="9" fill="none" stroke="${gs}" stroke-width="2"/>
      <circle cx="150" cy="256" r="9" fill="none" stroke="${gs}" stroke-width="1.6"/>`,
    "earrings": `<g stroke="${g}" stroke-width="2" fill="none">

/* Photos win over placeholders automatically. A piece can carry either
   `img:"images/nz-101.jpg"` or `gallery:["images/a.jpg","images/b.jpg", ...]`. */
function shot(p, view, theme){
  view = view || 0;
  const g = (p.gallery && p.gallery.length) ? p.gallery : (p.img ? [p.img] : null);
  if(g) return `<img src="${g[Math.min(view, g.length-1)]}" alt="${esc(p.name)}">`;
  return art(p, view, theme);
}
function shotCount(p){ return (p.gallery && p.gallery.length) ? p.gallery.length : 3; }

const rupee = n => "₹" + n.toLocaleString("en-IN");
const byId  = id => PRODUCTS.find(p => p.id === id);
const esc   = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function waLink(msg){ return `https://wa.me/${BRAND.whatsapp}?text=${encodeURIComponent(msg)}`; }
function waProduct(p){
  return waLink(`Hello Nazaakat, I'd like to know more about ${p.name} (${p.id}) — ${rupee(p.price)}. Is it in stock?`);
}

function card(p){
  const off = p.mrp > p.price ? `<s>${rupee(p.mrp)}</s>` : "";
  const badge = p.badge ? `<span class="badge ${p.badge==='new'?'new':''}">${p.badge==='new'?'New':'Bestseller'}</span>` : "";
  return `<a class="card" href="#/piece/${p.id}">
    <div class="shot">${shot(p)}${badge}</div>
    <div class="body">
      <span class="line-tag">${LINES[p.line].label} · ${TYPES[p.type]}</span>
      <h3>${esc(p.name)}</h3>
      <span class="price">${rupee(p.price)}${off}</span>
    </div></a>`;
}

let filterState = {line:[], type:[], band:[], occ:[], sort:"featured"};

function shopPage(lineKey, query){
  filterState = {line: lineKey?[lineKey]:[], type:[], band:[], occ:[], sort:"featured"};
  if(query.get("type")) filterState.type = [query.get("type")];
  if(query.get("sort"))  filterState.sort = query.get("sort");

  const L = lineKey ? LINES[lineKey] : null;
  const html = header(lineKey?`#/shop/${lineKey}`:"#/shop") + `
  <div class="wrap shop-top">
    <span class="eyebrow">${L ? "Counter" : "Everything"}</span>
    <h1>${L ? L.full + " jewellery" : "The whole counter"}</h1>
    <p>${L ? L.blurb : "Every piece across the three lines — western, American Diamond and ethnic. Filter it down, then message us about anything you like."}</p>
  </div>
  <div class="wrap shop-body">
    <aside class="filters" id="filters">
      ${fgroup("Line", "line", Object.entries(LINES).map(([k,v])=>[k,v.full]))}
      ${fgroup("Type", "type", Object.entries(TYPES))}
      ${fgroup("Price", "band", BANDS.map(b=>[b.id,b.label]))}
      ${fgroup("Occasion", "occ", Object.entries(OCCASIONS))}
      <div class="fgroup"><button class="btn btn-outline btn-block" onclick="clearFilters()">Clear all filters</button></div>
    </aside>
    <div>
      <div class="fbar">
        <button class="btn btn-outline ftoggle" onclick="document.getElementById('filters').classList.toggle('show')">Filters</button>
        <span class="count" id="count"></span>
        <select id="sort" onchange="filterState.sort=this.value;renderResults()">
          <option value="featured">Sort: featured</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
          <option value="new">Newest first</option>
        </select>
      </div>
      <div class="chips" id="chips"></div>
      <div id="results"></div>
    </div>
  </div>` + footer();
  return html;
}

function fgroup(title, key, opts){
  return `<div class="fgroup"><h4>${title}</h4>
    ${opts.map(([k,v])=>`<label class="fopt"><input type="checkbox" data-key="${key}" value="${k}" onchange="toggleFilter(this)"> ${v}</label>`).join("")}
  </div>`;
}
function toggleFilter(el){
  const k = el.dataset.key, v = el.value;
  filterState[k] = el.checked ? filterState[k].concat(v) : filterState[k].filter(x=>x!==v);
  renderResults();
}
function clearFilters(){
  filterState = {line:[],type:[],band:[],occ:[],sort:filterState.sort};
  document.querySelectorAll('.fopt input').forEach(i=>i.checked=false);
  renderResults();
}
function syncBoxes(){
  document.querySelectorAll('.fopt input').forEach(i=>{
    i.checked = (filterState[i.dataset.key]||[]).includes(i.value);
  });
  const s = document.getElementById('sort'); if(s) s.value = filterState.sort;
}
function renderResults(){
  let list = PRODUCTS.slice();
  if(filterState.line.length) list = list.filter(p=>filterState.line.includes(p.line));
  if(filterState.type.length) list = list.filter(p=>filterState.type.includes(p.type));
  if(filterState.occ.length)  list = list.filter(p=>p.occ.some(o=>filterState.occ.includes(o)));
  if(filterState.band.length){
    const bands = BANDS.filter(b=>filterState.band.includes(b.id));
    list = list.filter(p=>bands.some(b=>p.price>=b.min && p.price<=b.max));
  }
  if(filterState.sort==="low")  list.sort((a,b)=>a.price-b.price);
  if(filterState.sort==="high") list.sort((a,b)=>b.price-a.price);
  if(filterState.sort==="new")  list.sort((a,b)=>(b.badge==="new")-(a.badge==="new"));

  document.getElementById("count").textContent = list.length + (list.length===1?" piece":" pieces");
  const chipDefs = [];
  ["line","type","band","occ"].forEach(k=>{
    (filterState[k]||[]).forEach(v=>{
      const label = k==="line"?LINES[v].full : k==="type"?TYPES[v] : k==="band"?BANDS.find(b=>b.id===v).label : OCCASIONS[v];
      chipDefs.push(`<span class="chip">${label}<button aria-label="Remove filter" onclick="removeChip('${k}','${v}')">×</button></span>`);
    });
  });
  document.getElementById("chips").innerHTML = chipDefs.join("");
  document.getElementById("results").innerHTML = list.length
    ? `<div class="grid">${list.map(card).join("")}</div>`
    : `<div class="empty"><p style="margin-bottom:14px">Nothing on the counter matches that combination yet.</p>
       <button class="btn btn-outline" onclick="clearFilters()">Clear filters</button></div>`;
}
function removeChip(k,v){ filterState[k]=filterState[k].filter(x=>x!==v); syncBoxes(); renderResults(); }

      <details><summary>Will it turn my skin green?</summary><div class="ans">Brass can react with some skin types, usually in humid weather or on rings worn while washing hands. It washes off and is not harmful. If you know you react, tell us on WhatsApp and we will point you to the rhodium-plated pieces, which are far less likely to.</div></details>
      <details><summary>How long does the plating last?</summary><div class="ans">Realistically, one to three years of regular wear, and much longer for occasion pieces worn a few times a year. Water, sweat and perfume decide the number more than price does.</div></details>
      <details><summary>Is this real gold or diamond?</summary><div class="ans">No. Everything on this site is fashion jewellery — plated brass or alloy with cubic zirconia and synthetic stones. American Diamond means CZ, not a diamond. We keep that distinction clear on every product page.</div></details>
      <details><summary>Can I exchange or return a piece?</summary><div class="ans">Unworn pieces in their original pouch can be exchanged within 7 days. Earrings can only be exchanged if the seal is unopened, for hygiene reasons. Damage from water or perfume is not covered.</div></details>
      <details><summary>What if a stone falls out?</summary><div class="ans">Bring or send it back within 30 days and we re-set it free. After that we still repair it, usually for a small charge.</div></details>
      <details><summary>Do you make sets to match an outfit?</summary><div class="ans">Often, yes. Send a photo of the outfit on WhatsApp — we will show you what is on the counter, and for some ethnic sets we can get colours changed at the workshop in about ten days.</div></details>
      <details><summary>How do I order?</summary><div class="ans">Message us on WhatsApp with the piece name or a screenshot. We confirm stock, send extra photos, and arrange pick-up from the shop or courier delivery.</div></details>
    </div>
    <div style="margin-top:26px"><a class="btn btn-wa" href="${waLink('Hello Nazaakat, I have a question about a piece.')}" target="_blank" rel="noopener">${WA_ICON} Ask us anything</a></div>
  </div>` + footer();
}

/* ============================================================
   6. bag  (session-only for now; swap CART for your backend later)
   ============================================================ */
let CART = [];
const cartCount = () => CART.reduce((n,i)=>n+i.qty, 0);
const cartTotal = () => CART.reduce((n,i)=>n + byId(i.id).price * i.qty, 0);

function addToCart(id){
  const row = CART.find(i=>i.id===id);
  row ? row.qty++ : CART.push({id, qty:1});
  renderCart(); openCart();
  const b = document.querySelector(".cart-btn .n");
  if(b) b.textContent = cartCount(); else refreshHeaderCart();
}
function setQty(id, d){
  const row = CART.find(i=>i.id===id); if(!row) return;
  row.qty += d;
  if(row.qty < 1) CART = CART.filter(i=>i.id!==id);
  renderCart(); refreshHeaderCart();
}
function removeItem(id){ CART = CART.filter(i=>i.id!==id); renderCart(); refreshHeaderCart(); }
function refreshHeaderCart(){
  const btn = document.querySelector(".cart-btn"); if(!btn) return;
  const n = cartCount();
  btn.querySelector(".n")?.remove();
  if(n) btn.insertAdjacentHTML("beforeend", `<span class="n">${n}</span>`);
}
function openCart(){ renderCart(); document.getElementById("cartPanel").classList.add("on"); document.getElementById("scrim").classList.add("on"); }
function openStudio(){ renderStudio(); document.getElementById("studioPanel").classList.add("on"); document.getElementById("scrim").classList.add("on"); }
function closeAll(){ document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on")); document.getElementById("scrim").classList.remove("on"); }

function renderCart(){
  const el = document.getElementById("cartPanel");
  const items = CART.map(i=>{ const p = byId(i.id); return `
    <div class="citem">
      <a class="th" href="#/piece/${p.id}" onclick="closeAll()">${shot(p,0)}</a>
      <div>
        <h4>${esc(p.name)}</h4>
        <div class="meta">${LINES[p.line].label} · ${rupee(p.price)}</div>
        <div><span class="qty"><button onclick="setQty('${p.id}',-1)" aria-label="One less">−</button><span>${i.qty}</span><button onclick="setQty('${p.id}',1)" aria-label="One more">+</button></span>
        <button class="rm" onclick="removeItem('${p.id}')">Remove</button></div>
      </div></div>`; }).join("");

  el.innerHTML = `
    <header><h3>Your bag${cartCount()?` (${cartCount()})`:""}</h3><button class="x" onclick="closeAll()" aria-label="Close">×</button></header>
    <div class="scrolls">${items || `<div class="empty" style="margin-top:24px"><p style="margin-bottom:14px">Your bag is empty.</p><a class="btn btn-outline" href="#/shop" onclick="closeAll()">Browse the counter</a></div>`}</div>
    ${CART.length ? `<footer>
      <div class="ctot"><span>Total</span><span>${rupee(cartTotal())}</span></div>
      <p>Inclusive of taxes. Delivery confirmed on WhatsApp before payment.</p>
      ${FEATURES.payments
        ? `<button class="btn btn-wine btn-block" onclick="alert('Wire the payment gateway here.')">Pay now</button>`
        : `<a class="btn btn-wa btn-block" href="${waCart()}" target="_blank" rel="noopener">${WA_ICON} Send this order on WhatsApp</a>
           <p style="font-size:11.5px;color:var(--muted);margin-top:10px">Online payment goes live here — set <code>FEATURES.payments = true</code> once the gateway is connected and this button becomes Pay now.</p>`}
    </footer>` : ""}`;
}
function waCart(){
  const lines = CART.map((i,n)=>{ const p = byId(i.id); return `${n+1}. ${p.name} (${p.id}) × ${i.qty} — ${rupee(p.price*i.qty)}`; }).join("\n");
  return waLink(`Hello Nazaakat, I'd like to order:\n${lines}\nTotal: ${rupee(cartTotal())}\n\nPlease confirm stock and delivery.`);
}

/* ============================================================
   7. photo panel — drop in real pictures any time
   ============================================================ */
function renderStudio(){
  document.getElementById("studioPanel").innerHTML = `
    <header><h3>Photos</h3><button class="x" onclick="closeAll()" aria-label="Close">×</button></header>
    <div class="scrolls">
      <div class="note" style="margin:10px 0 6px">Pick photos for any piece and they replace the placeholder everywhere instantly — card, gallery, bag. This preview lasts for this session; to keep them, save the files into an <code>images/</code> folder beside this file and paste the line shown under each piece into the PRODUCTS array.</div>
      ${PRODUCTS.map(p=>`<div class="studio-row">
        <div class="th">${shot(p,0)}</div>
        <div>
          <h4>${esc(p.name)}</h4>
          <div class="code">${p.gallery&&p.gallery.length?`${p.gallery.length} photo${p.gallery.length>1?"s":""} loaded`:`gallery:["images/${p.id}-1.jpg","images/${p.id}-2.jpg"]`}</div>
          <input type="file" accept="image/*" multiple onchange="loadPhotos('${p.id}', this.files)">
          ${p.gallery&&p.gallery.length?`<button class="rm" style="margin:6px 0 0" onclick="clearPhotos('${p.id}')">Clear</button>`:""}
        </div></div>`).join("")}
    </div>`;
}
function loadPhotos(id, files){
  const p = byId(id); if(!files.length) return;
  const urls = [];
  let done = 0;
  [...files].slice(0,6).forEach((f,i)=>{
    const r = new FileReader();
    r.onload = e => { urls[i] = e.target.result; if(++done === Math.min(files.length,6)){ p.gallery = urls.filter(Boolean); router(); renderStudio(); } };
    r.readAsDataURL(f);
  });
}
function clearPhotos(id){ byId(id).gallery = []; router(); renderStudio(); }

/* ============================================================
   9. router
   ============================================================ */
function router(){
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const seg = path.split("/").filter(Boolean);
  const query = new URLSearchParams(qs || "");
  const app = document.getElementById("app");
  document.body.classList.remove("pdp-page");

  if(seg[0] === "shop"){
    app.innerHTML = shopPage(LINES[seg[1]] ? seg[1] : null, query);
    syncBoxes(); renderResults();
  } else if(seg[0] === "piece"){
    document.body.classList.add("pdp-page");
    app.innerHTML = piecePage(seg[1]);
  } else if(seg[0] === "about"){
    app.innerHTML = aboutPage();
  } else if(seg[0] === "care"){
    app.innerHTML = carePage();
  } /* else if(seg[0] === "palettes"){
    app.innerHTML = palettesPage();
  } */ else if(seg[0] === "visit"){
    app.innerHTML = visitPage();
  } else {
    app.innerHTML = homePage();
  }
  // renderDevbar(); // Palette switcher disabled — default theme only. Uncomment to restore.
  if(FEATURES.cart) renderCart();
  if(!suppressScroll) window.scrollTo(0,0);
  suppressScroll = false;
}
let suppressScroll = false;
window.addEventListener("hashchange", router);
router();
</script>
